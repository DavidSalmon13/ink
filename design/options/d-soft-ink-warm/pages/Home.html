<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בית — Ink · Soft ink + warmth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EDE2;--surface:#FBF8F3;--surface-alt:#E8DFD0;--text:#36291F;--muted:#6B5A50;--border:#E0D5C3;--border-strong:#B9A792;--primary:#76544B;--on-primary:#FBF8F3;--tint:#E9DCD3;--line:#76544B;--danger:#A2392E;--on-danger:#FBF8F3;--success:#3D7148;--av:#3F8050;--re:#C46C1C;--do:#B23A2E;--scrim:rgba(54,41,31,0.4);--focus:#76544B;--cm-bg:#76544B;--cm-surface:#FBF8F3;--cm-text:#FBF8F3;--cm-muted:#EADFD8;--fh:'Frank Ruhl Libre', serif;--accent:#7A5472;--on-accent:#FBF8F3;--accent-tint:#EEE2EA;--fb:'Rubik', sans-serif;--r-sm:12px;--r-md:18px;--r-lg:26px;--pad:20px;--row:60px;--btn-h:52px;--in-h:52px;--sh-card:0 4px 14px rgba(54,41,31,0.07);--sh-raised:0 8px 22px rgba(54,41,31,0.1);--sh-modal:0 20px 44px rgba(54,41,31,0.22);--gap:16px;--gap-s:8px;--gap-l:20px}
body{margin:0;background:#D8D2C8;display:flex;justify-content:center;padding:24px 0}

*{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
button,input,select{font-family:inherit;color:inherit}
.screen{width:393px;min-height:852px;background:var(--bg);color:var(--text);font-family:var(--fb);position:relative;overflow:hidden;padding-top:54px;padding-bottom:40px}
.screen.has-tabbar{padding-bottom:110px}
.screen.ipad{width:1180px;height:820px;min-height:0;padding:24px 0 0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ic{flex:none;display:block}
.stack{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.px{padding-inline:var(--pad)}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px var(--pad) 12px;min-height:56px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--text);border-radius:999px;padding:0;cursor:pointer}
.btn{min-height:var(--btn-h);padding:0 20px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);padding:0 8px}
.btn-destructive{background:var(--danger);color:var(--on-danger)}
.btn:disabled,.btn[aria-disabled=true]{background:var(--surface-alt);color:var(--muted);border-color:transparent;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 14px;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:13px;font-weight:600;color:var(--muted)}
.input{min-height:var(--in-h);width:100%;padding:0 14px;border:1px solid var(--border-strong);background:var(--surface);font-size:16px;display:flex;align-items:center;gap:8px;color:var(--text)}
.input.error{border-color:var(--danger);border-width:1.5px}
.input .unit{color:var(--muted);font-size:14px}
.helper{font-size:13px;color:var(--muted)}
.helper.err{color:var(--danger);font-weight:600}
.search{display:flex;align-items:center;gap:8px;min-height:var(--in-h);padding:0 12px;background:var(--surface);color:var(--muted)}
.search input{border:0;background:transparent;font-size:16px;flex:1;min-width:0;outline:none;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;padding:3px;gap:2px;background:var(--surface-alt)}
.seg button{flex:1;min-height:38px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.seg button small{font-size:11px;color:var(--muted);font-weight:400}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--primary);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-decoration:none;min-height:36px;padding:0 14px;border:1px solid var(--border-strong);background:transparent;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;flex:none}
.dot.available{background:var(--av)}.dot.reserved{background:var(--re)}.dot.done{background:var(--do)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text)}
.card{background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;min-height:var(--row);padding:10px var(--pad);color:var(--text);text-decoration:none}
.rows>.row+.row{border-top:1px solid var(--border)}
.section-h{display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);margin:28px 0 10px}
.tabbar{position:absolute;inset-inline:0;bottom:0;display:flex;justify-content:space-around;padding:8px 8px 30px;background:var(--surface);border-top:1px solid var(--border);z-index:20}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;min-width:60px;min-height:44px}
.tabbar a[aria-current=page]{color:var(--primary);font-weight:700}
.backdrop{position:absolute;inset:0;background:var(--scrim);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:353px;background:var(--surface);box-shadow:var(--sh-modal);z-index:110;display:flex;flex-direction:column;max-height:760px;overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 20px;padding-inline-start:20px;padding-inline-end:8px}
.modal-b{padding:4px 20px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.modal-f{display:flex;gap:10px;padding:14px 20px 20px;border-top:1px solid var(--border)}
.modal-f .btn{flex:1}
.prefill{font-size:13px;color:var(--primary);display:flex;align-items:center;gap:6px;font-weight:600}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--text);color:var(--bg);font-size:15px;font-weight:500;box-shadow:var(--sh-raised)}
.toast.err{background:var(--danger);color:var(--on-danger)}
.skel{background:var(--surface-alt);border-radius:4px}
.thumb{background:var(--surface-alt);color:var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb .art{width:78%;height:78%}
.avatar{width:44px;height:44px;border-radius:999px;background:var(--tint);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.timeline{position:relative}
.hourline{display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--border);position:relative}
.hourline .h{width:44px;font-size:12px;color:var(--muted);transform:translateY(-8px);background:var(--bg);text-align:end;padding-inline-end:6px}
.appt{position:absolute;inset-inline-start:58px;inset-inline-end:var(--pad);padding:8px 12px;overflow:hidden;background:var(--tint);color:var(--text);border-inline-start:3px solid var(--primary);text-decoration:none;display:block}
.appt .who{font-weight:700;font-size:14px}
.appt .what{font-size:13px;color:var(--muted)}
.appt.cancelled{background:transparent;border:1px dashed var(--border-strong);border-inline-start:3px solid var(--border-strong)}
.appt.cancelled .who{text-decoration:line-through;color:var(--muted)}
.nowline{position:absolute;inset-inline-start:52px;inset-inline-end:0;height:2px;background:var(--danger)}
.nowline:before{content:"";position:absolute;inset-inline-start:-5px;top:-4px;width:10px;height:10px;border-radius:999px;background:var(--danger)}
.lock-pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid currentColor;background:transparent;font-size:14px;font-weight:600;cursor:pointer;border-radius:999px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;padding:5px 0}
.sum-row.total{font-size:18px;font-weight:700;border-top:1px solid var(--border);margin-top:6px;padding-top:12px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 var(--pad)}
.tabs a{min-height:44px;display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current=page]{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--primary)}

.t-display{font-family:var(--fh);font-size:36px;line-height:42px;font-weight:500}
.t-title1{font-family:var(--fh);font-size:28px;line-height:34px;font-weight:500}
.t-title2{font-family:var(--fh);font-size:21px;line-height:28px;font-weight:500}
.t-headline{font-family:var(--fb);font-size:16px;line-height:22px;font-weight:500}
.t-body{font-family:var(--fb);font-size:16px;line-height:24px;font-weight:400}
.t-callout{font-family:var(--fb);font-size:14px;line-height:20px;font-weight:400}
.t-caption{font-family:var(--fb);font-size:13px;line-height:18px;font-weight:400}
.t-overline{font-family:var(--fb);font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.4px}
.t-price{font-family:var(--fh);font-size:30px;line-height:36px;font-weight:500}

.btn{border-radius:999px}
.input{border-radius:var(--r-sm);border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong)}
.search{border-radius:999px;background:var(--surface);box-shadow:var(--sh-card)}
.seg{border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button[aria-pressed=true]{box-shadow:var(--sh-card)}
.btn-secondary{background:var(--tint);border-color:transparent}
.chip{border-radius:999px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong)}
.chip[aria-pressed=true]{box-shadow:none}
.card{border-radius:var(--r-md);box-shadow:var(--sh-card)}
.section-h h2{font-size:19px;font-weight:500}
.modal{border-radius:var(--r-lg)}
.toast{border-radius:999px;padding:12px 20px}
.thumb{border-radius:14px}
.appt{border-radius:14px;border-inline-start:0;background:var(--surface);box-shadow:var(--sh-card)}
.appt:before{content:"";position:absolute;inset-inline-start:10px;top:12px;width:8px;height:8px;border-radius:999px;background:var(--primary)}
.appt .who,.appt .what{padding-inline-start:14px}
.appt.cancelled{box-shadow:none}
.appt.cancelled:before{background:var(--border-strong)}
.rows>.row+.row{border-top:0}
.tabbar{inset-inline:16px;bottom:22px;border-radius:999px;border:0;padding:8px 6px;box-shadow:var(--sh-raised)}
.tabbar a{min-width:56px;border-radius:999px;padding:4px 0}
.tabbar a[aria-current=page]{background:var(--tint)}
.overline{font-size:13px;font-weight:500;color:var(--muted)}
.tabs{border-bottom:0;gap:6px;padding:4px var(--pad)}
.tabs a{border:0;border-radius:999px;min-height:40px;margin:0;background:var(--surface-alt)}
.tabs a[aria-current=page]{background:var(--primary);color:var(--on-primary)}


.section-h h2{font-family:var(--fh);font-size:22px;font-weight:500}
.nowline{background:var(--accent)}.nowline:before{background:var(--accent)}
.badge-accent{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-tint);color:var(--accent)}
.tabbar a[aria-current=page]{background:var(--accent-tint);color:var(--accent)}
.wd[aria-pressed=true]{background:var(--accent)!important;color:var(--on-accent)!important}
.ornament{color:var(--line);opacity:.9}

.tile{min-height:116px;padding:16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--text)}.tile .well{width:52px;height:52px;border-radius:18px;background:var(--tint);color:var(--primary);display:flex;align-items:center;justify-content:center}.tile.hero{background:var(--primary);color:var(--on-primary)}.tile.hero .well{background:rgba(251,248,243,.16);color:var(--on-primary)}.appt-card{display:flex;align-items:center;gap:14px;padding:12px 14px;text-decoration:none;color:var(--text)}.appt-card .time{min-width:62px;height:44px;border-radius:14px;background:var(--tint);color:var(--primary);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center}.sec{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:999px;background:var(--surface-alt);color:var(--text);text-decoration:none;font-size:14px;font-weight:500}.sec .ic{color:var(--primary)}.next{display:flex;gap:14px;padding:12px;align-items:center;text-decoration:none;color:var(--text);box-shadow:var(--sh-raised)}.next .nx{width:92px;height:92px;background:var(--bg)}.next .nx .art{width:88%;height:88%}.tile{min-height:100px}.sec{min-height:44px}
</style>
</head>
