# Local development services: the database and an S3-compatible attachment store.
# Usage: cp .env.example .env  (set POSTGRES_PASSWORD)  &&  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: ink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ink}
      POSTGRES_USER: ${POSTGRES_USER:-ink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Attachments (S3-compatible, like Cloudflare R2 in production). Creates the bucket on start.
  # In-memory store: uploaded files are gone when the container is removed.
  s3mock:
    image: adobe/s3mock:4.12.4
    container_name: ink-s3mock
    restart: unless-stopped
    environment:
      initialBuckets: ${STORAGE_BUCKET:-ink-attachments}
    ports:
      - "${S3MOCK_PORT:-9090}:9090"

volumes:
  ink-pgdata:
